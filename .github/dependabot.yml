version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Stay past pnpm's minimumReleaseAge (24h) so CI installs are not rejected
    cooldown:
      default-days: 2
    groups:
      npm:
        patterns:
          - "*"
